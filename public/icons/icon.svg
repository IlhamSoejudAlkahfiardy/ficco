<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ficco-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="doc-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#ficco-grad)" />

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#60a5fa" stroke-width="6" stroke-opacity="0.4" />

  <!-- Central Graphic / Monogram F + Invoice Sheet -->
  <g filter="url(#shadow)">
    <!-- Document folded corner effect -->
    <path d="M 148 116 L 316 116 L 364 164 L 364 396 C 364 407.046 355.046 416 344 416 L 148 416 C 136.954 416 128 407.046 128 396 L 128 136 C 128 124.954 136.954 116 148 116 Z" fill="url(#doc-grad)" />
    <!-- Folded corner tab -->
    <path d="M 316 116 L 316 164 L 364 164 Z" fill="#cbd5e1" />

    <!-- Stylized "F" inside document -->
    <path d="M 188 184 L 304 184 C 310.627 184 316 189.373 316 196 C 316 202.627 310.627 208 304 208 L 224 208 L 224 244 L 284 244 C 290.627 244 296 249.373 296 256 C 296 262.627 290.627 268 284 268 L 224 268 L 224 348 C 224 354.627 218.627 360 212 360 C 205.373 360 200 354.627 200 348 L 200 196 C 200 189.373 205.373 184 212 184 Z" fill="#2563eb" />

    <!-- Small financial accent line in document footer -->
    <rect x="200" y="376" width="112" height="10" rx="5" fill="#93c5fd" />
  </g>
</svg>
